<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bromaslog</title>
  <meta name="theme-color" content="#F2F0EB">

  <!-- Lock scrolling from the very first paint: the preloader runs on every load. -->
  <script>document.documentElement.classList.add('is-loading');</script>
  <noscript><style>#preloader{display:none!important}html{overflow:auto!important}</style></noscript>

  <link rel="preload" as="image" href="assets/fabric-poster-960.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/fabric-poster.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high">
  <link rel="stylesheet" href="css/preloader.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <!-- Carbon-fibre background of the site: revealed when the preloader wave fades out. -->
  <div id="site-bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 767px)" srcset="assets/fabric-poster-960.webp" type="image/webp">
      <img class="bg-poster" src="assets/fabric-poster.webp" alt="" width="1672" height="941"
           fetchpriority="high" decoding="async" draggable="false">
    </picture>
    <!-- Optional. Sources are attached lazily after the preloader; if the files are missing the poster stays. -->
    <video class="bg-video" muted loop playsinline preload="none" disablepictureinpicture
           data-src-webm="assets/fabric.webm" data-src-mp4="assets/fabric.mp4"></video>
  </div>

  <!-- Preloader: off-white paper + the logo drawn part by part on a canvas (BRO / MAS / LOG).
       The closing "wave" is a WebGL canvas created by js/preloader.js. -->
  <div id="preloader" role="status" aria-label="Caricamento di Bromaslog">
    <canvas class="pl-logo" id="pl-logo" role="img" aria-label="Bromaslog"></canvas>
  </div>

  <!-- ============ SITE (placeholder: replace with the real homepage) ============ -->
  <main id="site">
    <header class="site-header">
      <span class="site-brand">Bromaslog</span>
      <nav aria-label="Principale">
        <a href="#">Prodotti</a>
        <a href="#">Azienda</a>
        <a href="#">Contatti</a>
      </nav>
    </header>
    <section class="site-hero">
      <p class="site-eyebrow">Tessuti tecnici industriali</p>
      <h1>Precisione<br>in ogni fibra.</h1>
    </section>
  </main>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/preloader.js"></script>
</body>
</html>
