<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bromaslog</title>
  <meta name="theme-color" content="#F7F7F7">

  <!-- Lock scrolling from the very first paint: the preloader runs on every load. -->
  <script>document.documentElement.classList.add('is-loading');</script>
  <noscript><style>#preloader{display:none!important}html{overflow:auto!important}</style></noscript>

  <link rel="preload" as="image" href="assets/bg-poster-960.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/bg-poster.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high">
  <link rel="preload" href="assets/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/preloader.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <!-- Background of the site: a still frame first (instant), the looping GIF fades in over it once it has loaded. -->
  <div id="site-bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 767px)" srcset="assets/bg-poster-960.webp" type="image/webp">
      <img class="bg-poster" src="assets/bg-poster.webp" alt="" width="1280" height="720"
           fetchpriority="high" decoding="async" draggable="false">
    </picture>
    <!-- No src on purpose: js/preloader.js loads it after the page is ready (and skips it for reduced motion / data saver). -->
    <img class="bg-gif" alt="" width="640" height="360" data-src="assets/king-loop.gif" decoding="async" draggable="false">
  </div>

  <!-- Preloader: off-white paper + the logo drawn part by part on a canvas (BRO / MAS / LOG).
       The closing "wave" is a WebGL canvas created by js/preloader.js. -->
  <div id="preloader" role="status" aria-label="Caricamento di Bromaslog">
    <canvas class="pl-logo" id="pl-logo" role="img" aria-label="Bromaslog"></canvas>
  </div>

  <!-- ============ SITE (placeholder: replace with the real homepage) ============ -->
  <main id="site">
    <header class="site-header">
      <a class="site-brand" href="#">Bromaslog</a>
      <nav class="glass-nav" aria-label="Principale">
        <a href="#">Chi siamo</a>
        <a href="#">Portfolio</a>
        <a href="#" class="is-cta">Contact</a>
      </nav>
    </header>
    <section class="site-hero">
      <p class="site-eyebrow">Tessuti tecnici industriali</p>
      <h1>Precisione<br>in ogni fibra.</h1>
    </section>
  </main>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
